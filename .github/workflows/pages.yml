name: Build and check

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -r build/requirements.txt
      - name: Build the site
        run: python3 build/build.py
      - name: Validate links, metadata, data, privacy and checksums
        run: python3 build/check.py
      - name: Report output size
        run: du -sh public && find public -type f | wc -l

  # The static checks cannot see rendering, focus order or contrast. This job runs
  # the same Chromium the maintainer runs locally, on every push and pull request.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r build/requirements.txt
      - run: npm ci
      - run: python3 build/build.py
      - name: Browser checks
        run: node build/browser_check.mjs --shots "$RUNNER_TEMP/jagent-shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-shots
          path: ${{ runner.temp }}/jagent-shots
          if-no-files-found: ignore

  # Publishing is a deliberate action. It only runs when triggered by hand from the
  # Actions tab, after Pages has been enabled in the repository settings.
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r build/requirements.txt
      - run: python3 build/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tagging builds the archives on a runner and attaches them, so a release is
  # reproducible from the tag alone and does not depend on someone's machine.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r build/requirements.txt
      - name: Build and package
        run: |
          python3 build/build.py
          python3 build/check.py
          python3 build/package.py
          cat releases/SHA256SUMS.txt
          ls -l releases
      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" releases/*.zip releases/SHA256SUMS.txt --clobber
